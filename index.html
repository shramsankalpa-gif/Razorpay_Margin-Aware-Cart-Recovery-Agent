<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Margin-Aware Cart Recovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed navy nav rail + scrolling work area; dense, scannable merchant console */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EEF1F7; --line:#DCE2EC; --line-2:#C8D0DE;
  --fg:#101B33; --fg-2:#46536E; --fg-3:#76829B;
  --accent:#1F5CE0; --accent-ink:#FFFFFF; --accent-soft:#E5EDFD;
  --nav-bg:#0C172E; --nav-fg:#B9C5DD; --nav-fg-strong:#FFFFFF; --nav-hover:#16233F; --nav-muted:#5E6B86;
  --good:#11804F; --good-soft:#E1F3EA; --warn:#A35F00; --warn-soft:#FCEFD8; --bad:#BC3434; --bad-soft:#FAE4E4;
  --control:#6B48C0; --control-soft:#EEE8FA; --test:#0F7F8C; --test-soft:#E0F2F4;
  --s-agent:#1F5CE0; --s-flat:#8C95A8; --s-tier:#C7832A;
  --wa:#E7F6EC; --wa-ink:#173D27;
  --shadow:0 1px 2px rgba(16,27,51,.06),0 8px 24px rgba(16,27,51,.08);
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A111F; --surface:#111A2C; --surface-2:#172238; --line:#24304A; --line-2:#33405D;
  --fg:#E5EBF6; --fg-2:#A7B3CA; --fg-3:#7B88A3;
  --accent:#5B8CFF; --accent-ink:#06122C; --accent-soft:#18284D;
  --nav-bg:#060C18; --nav-fg:#9FACC6; --nav-fg-strong:#FFFFFF; --nav-hover:#101A2E; --nav-muted:#4B5873;
  --good:#3EC48B; --good-soft:#0F2B1F; --warn:#EDB050; --warn-soft:#33250E; --bad:#F27575; --bad-soft:#381717;
  --control:#A58BEE; --control-soft:#241B3D; --test:#4CC3CF; --test-soft:#0D2A2E;
  --s-agent:#5B8CFF; --s-flat:#7F8AA0; --s-tier:#E0A04A;
  --wa:#163323; --wa-ink:#D7F0DF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A111F; --surface:#111A2C; --surface-2:#172238; --line:#24304A; --line-2:#33405D;
  --fg:#E5EBF6; --fg-2:#A7B3CA; --fg-3:#7B88A3;
  --accent:#5B8CFF; --accent-ink:#06122C; --accent-soft:#18284D;
  --nav-bg:#060C18; --nav-fg:#9FACC6; --nav-fg-strong:#FFFFFF; --nav-hover:#101A2E; --nav-muted:#4B5873;
  --good:#3EC48B; --good-soft:#0F2B1F; --warn:#EDB050; --warn-soft:#33250E; --bad:#F27575; --bad-soft:#381717;
  --control:#A58BEE; --control-soft:#241B3D; --test:#4CC3CF; --test-soft:#0D2A2E;
  --s-agent:#5B8CFF; --s-flat:#7F8AA0; --s-tier:#E0A04A;
  --wa:#163323; --wa-ink:#D7F0DF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:700}
h2{font-size:16px;font-weight:650}
h3{font-size:14px;font-weight:650}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)}
.faint{color:var(--fg-3)}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.nav{background:var(--nav-bg);color:var(--nav-fg);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.nav-brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.nav-brand .mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.nav-brand b{color:var(--nav-fg-strong);font-size:13.5px;display:block;line-height:1.2}
.nav-brand small{font-size:11.5px;color:var(--nav-muted)}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group .label{color:var(--nav-muted);padding:0 10px 6px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--nav-fg)}
.nav button:hover{background:var(--nav-hover);color:var(--nav-fg-strong)}
.nav button[aria-current="page"]{background:var(--accent);color:#fff}
.nav button[disabled]{color:var(--nav-muted);cursor:default}
.nav button[disabled]:hover{background:none}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav-foot{margin-top:auto;font-size:11.5px;color:var(--nav-muted);padding:0 10px;line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-3);min-width:0}
.crumb b{color:var(--fg);font-weight:600}
.topbar .spacer{flex:1}
.menu-btn{display:none}
.concept{font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:3px 9px;border-radius:999px;white-space:nowrap}
.sel{display:flex;align-items:center;gap:6px}
select,input[type="text"],input[type="number"],input[type="search"]{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:6px 9px;min-height:34px}
select{padding-right:28px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fg-3) 50%),linear-gradient(135deg,var(--fg-3) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input[type="number"]{width:78px;text-align:right}
.content{padding-block:24px 48px;padding-inline:24px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head p{color:var(--fg-2);max-width:68ch;margin-top:4px}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-head p{color:var(--fg-2);font-size:13px;margin-top:3px;max-width:70ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:7px 12px;min-height:34px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--fg-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.p-good{color:var(--good);background:var(--good-soft)}
.p-warn{color:var(--warn);background:var(--warn-soft)}
.p-bad{color:var(--bad);background:var(--bad-soft)}
.p-info{color:var(--accent);background:var(--accent-soft)}
.p-control{color:var(--control);background:var(--control-soft)}
.p-test{color:var(--test);background:var(--test-soft)}
.p-mute{color:var(--fg-2);background:var(--surface-2)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;padding:2px;background:var(--surface-2);gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:5px;font-size:12.5px;font-weight:600;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(16,27,51,.12)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:36px;height:20px;border-radius:999px;background:var(--line-2);position:relative;transition:background .15s;flex:none}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked + .track{background:var(--good)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.switch input:disabled + .track{opacity:.55}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;background:var(--surface)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip:focus-visible{outline:2px solid var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.banner.info{background:var(--accent-soft);border-color:transparent}
.banner.info b{color:var(--accent)}

/* marketplace */
.agent-feature{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;padding:22px;border:1px solid var(--accent);border-radius:10px;background:var(--surface)}
.agent-feature h2{font-size:20px}
.agent-feature ul{margin:10px 0 0;padding-left:18px;color:var(--fg-2);display:grid;gap:4px}
.agent-meta{display:grid;gap:10px;align-content:start;background:var(--surface-2);border-radius:8px;padding:14px;font-size:13px}
.agent-meta div{display:flex;justify-content:space-between;gap:12px}
.agent-card{display:flex;flex-direction:column;gap:8px}
.agent-card .ico{width:34px;height:34px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--fg-2)}
.agent-card .ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.agent-card p{color:var(--fg-2);font-size:13px}
.agent-card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:6px}

/* kpis */
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi:hover{border-color:var(--accent)}
.kpi:focus-visible{outline:2px solid var(--accent)}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--fg-2)}
.kpi .s b{color:var(--good);font-weight:600}
.phase-bar{display:grid;grid-template-columns:21fr 25fr 44fr;gap:3px;margin-top:10px}
.phase-bar div{height:8px;border-radius:2px;background:var(--line-2)}
.phase-bar div.on{background:var(--accent)}
.phase-labels{display:grid;grid-template-columns:21fr 25fr 44fr;gap:3px;font-size:11.5px;color:var(--fg-3);margin-top:6px}
.phase-labels b{color:var(--fg);font-weight:600;display:block}
.chart-box{position:relative;height:280px}
.chart-box.sm{height:230px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-2)}
.legend label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}

/* curve explorer */
.explorer{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.ctrl{display:grid;gap:16px}
.ctrl .field{display:grid;gap:6px}
.readout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.readout .big{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.readout .big.good{color:var(--good)}

/* recommendations */
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rec.approved{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.rec.rejected{opacity:.78}
.rec-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rec h3{font-size:13.5px}
.offer{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.offer .amt{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.offer .amt.zero{font-size:20px;color:var(--fg-2)}
.rec-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px;border-top:1px solid var(--line);padding-top:10px}
.rec-stats b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.rec-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.why{background:var(--surface-2);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--fg-2);line-height:1.55}
.ask{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.ask-form{display:flex;gap:8px}
.ask-form input{flex:1;min-width:0}
.answer{background:var(--surface-2);border-radius:8px;padding:14px;min-height:72px;white-space:pre-wrap;line-height:1.6}
.answer.empty{color:var(--fg-3)}
.mode{font-size:11.5px;font-weight:600}

/* setup */
.setup-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.cat-tbl input[type="text"]{width:100%;min-width:150px}
.cat-tbl select{min-width:190px;max-width:100%}
.cat-tbl td{padding:7px 10px}
.warn-txt{color:var(--warn);font-size:12px}
.setting{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0;padding-bottom:0}
.setting:first-child{padding-top:0}
.setting p{font-size:12.5px;color:var(--fg-2);margin-top:2px}
.radio-list{display:grid;gap:8px}
.radio-list label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:7px;cursor:pointer}
.radio-list label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-list label.dis{opacity:.55;cursor:not-allowed}
.drop{border:1.5px dashed var(--line-2);border-radius:8px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

/* log + drawer */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--fg-2)}
.scrim{position:fixed;inset:0;background:rgba(6,12,24,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:51;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.modal{position:fixed;z-index:51;top:50%;left:50%;transform:translate(-50%,-50%);width:min(680px,calc(100% - 32px));max-height:calc(100% - 48px);background:var(--surface);border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal .drawer-body{padding:20px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{all:unset;cursor:pointer;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--fg-2)}
.x:hover{background:var(--surface-2)}
.x:focus-visible{outline:2px solid var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--fg-3)}
.kv dd{margin:0}
.bubble{background:var(--wa);color:var(--wa-ink);border-radius:10px 10px 10px 2px;padding:12px 14px;max-width:360px;font-size:13.5px;line-height:1.55}
.bubble .cta{display:block;margin-top:10px;padding-top:9px;border-top:1px solid color-mix(in srgb,var(--wa-ink) 18%,transparent);font-weight:600;color:var(--accent);text-align:center}
.bubble small{display:block;margin-top:8px;opacity:.7;font-size:11.5px}
.checks{display:grid;gap:7px;font-size:13px}
.checks div{display:flex;gap:9px;align-items:flex-start}
.checks .ok{color:var(--good);font-weight:700}
.checks .no{color:var(--bad);font-weight:700}
.diff-new{background:var(--good-soft)}
.diff-chg{color:var(--accent);font-weight:600}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.empty-state{text-align:center;padding:36px 16px;color:var(--fg-2)}
.spark{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}

@media (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .setup-grid,.explorer,.split{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:fixed;left:0;top:0;bottom:0;width:248px;z-index:55;transform:translateX(-100%);transition:transform .2s;height:auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .nav.open{transform:none}
  .menu-btn{display:inline-flex}
  .topbar{padding:10px 16px}
  .content{padding-inline:16px}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
  .agent-feature{grid-template-columns:minmax(0,1fr)}
  .readout{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .g4{grid-template-columns:minmax(0,1fr)}
  .topbar .concept{order:5}
  .rec-stats{grid-template-columns:1fr 1fr}
}

const LIBS = {};
function loadScript(src) { return LIBS[src] || (LIBS[src] = new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load")); document.head.appendChild(s); })); }
const XLSX_URL = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
const PDF_URL = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
const PDFW_URL = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
$("#fileIn").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) handleFile(f); };
const numOf = v => { if (v === null || v === undefined || v === "") return NaN; if (typeof v === "number") return v <= 1 && v > 0 ? v * 100 : v; const n = parseFloat(String(v).replace(/[^0-9.]/g, "")); return n; };
function rowsFromTable(aoa) {
  const hi = aoa.findIndex(r => r.some(c => /margin/i.test(String(c))));
  if (hi < 0) return [];
  const h = aoa[hi].map(c => String(c).toLowerCase());
  const col = re => h.findIndex(c => re.test(c));
  const iName = col(/categ|name|product line/), iType = col(/type/), iMargin = col(/margin/), iCap = col(/max|cap|discount/);
  if (iName < 0 || iMargin < 0) return [];
  return aoa.slice(hi + 1).filter(r => r[iName] && !isNaN(numOf(r[iMargin]))).map(r => ({ name: String(r[iName]).trim(), type: iType >= 0 ? String(r[iType] || "").trim() : "", margin: numOf(r[iMargin]), cap: iCap >= 0 ? numOf(r[iCap]) : NaN }));
}
function rowsFromText(text) {
  const out = [];
  text.split(/\n/).forEach(line => {
    line = line.replace(/\s*(?:>|›)\s*/g, " › ");
    const nums = [...line.matchAll(/(\d{1,2}(?:\.\d+)?)\s*%/g)].map(x => parseFloat(x[1]));
    if (nums.length < 2) return;
    const name = line.split(/\d{1,2}(?:\.\d+)?\s*%/)[0].replace(/[|,;:\t]+/g, " ").trim();
    if (!name || /margin/i.test(name)) return;
    const typeHit = Object.keys(TYPES).find(t => name.includes(t));
    out.push({ name: typeHit ? name.replace(typeHit, "").trim() : name, type: typeHit || "", margin: nums[0], cap: nums[1] });
  });
  return out;
}
async function pdfText(file) {
  await loadScript(PDFW_URL); await loadScript(PDF_URL);
  const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = PDFW_URL;
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  let text = "";
  for (let p = 1; p <= Math.min(doc.numPages, 10); p++) {
    const pg = await doc.getPage(p), tc = await pg.getTextContent();
    const lines = {}; tc.items.forEach(it => { const y = Math.round(it.transform[5]); (lines[y] = lines[y] || []).push(it); });
    Object.keys(lines).sort((a, b) => b - a).forEach(y => { text += lines[y].sort((a, b) => a.transform[4] - b.transform[4]).map(i => i.str).join(" ") + "\n"; });
  }
  return text;
}
async function handleFile(file) {

  let rows = [], text = "";
  try {
    if (/\.(xlsx|xls|csv)$/.test(name)) {
      await loadScript(XLSX_URL);
      const wb = window.XLSX.read(await file.arrayBuffer(), { type: "array" });
      for (const sn of wb.SheetNames) { rows = rowsFromTable(window.XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true })); if (rows.length) break; }
    } else if (name.endsWith(".pdf")) {

  } catch (e) { toast("Couldn't open that file. Try the template instead."); return; }
  if (!rows.length && text && AI.fn) {
    try { const out = await aiJson(`Extract product categories from this document. Reply with only a JSON array of {"name": string, "type": string, "margin": number (percent), "cap": number (max discount percent, null if absent)}.\n\n${text.slice(0, 20000)}`); if (Array.isArray(out)) rows = out.map(o => ({ name: String(o.name || ""), type: String(o.type || ""), margin: +o.margin, cap: o.cap == null ? NaN : +o.cap })).filter(r => r.name && !isNaN(r.margin)); }

function showDiff(fname, rows) {

    ${top.map(r => { const f = find(r.name); const o = f ? f[1] : null; return `<tr class="${o ? "" : "diff-new"}"><td>${esc(r.name)} ${o ? "" : '<span class="pill p-good plain">New</span>'}</td><td>${o && o.type === r.type ? esc(r.type) : `<span class="diff-chg">${esc(r.type)}</span>`}</td><td class="r num">${cell(o ? o.margin : undefined, r.margin)}</td><td class="r num">${cell(o ? o.cap : undefined, r.cap)}</td></tr>`; }).join("")}
    ${removed.map(([k, c]) => `<tr><td><s class="faint">${esc(c.name)}</s> <span class="pill p-bad plain">Removed</span></td><td class="faint">${esc(c.type)}</td><td class="r faint num">${c.margin}%</td><td class="r faint num">${c.cap}%</td></tr>`).join("")}
    </tbody></table></div>`;

  };
}

const NBA_CACHE = {};
function nextActions(id) {

    });

  list.push(regOn ? { id: "region", title: `Region tier adds only ${inrSigned(-rv)} per 1,000 carts`, text: "Region can act as a proxy for income. If fairness matters more than this amount to you, switch it off.", btn: "Switch region off", act: () => { cfg.signals.region = false; markChanged("Region signal off"); } }
    : { id: "region", title: `Turning region back on would add ${inrSigned(rv)} per 1,000 carts`, text: "Only the city tier is used, never the address.", btn: "Switch region on", act: () => { cfg.signals.region = true; markChanged("Region signal on"); } });
  const st = bucketStats(id, SIG_IDX.status).slice(1).filter(b => b.n), fn = st.reduce((a, b) => a + b.n, 0);

$("#merchantSel").value = S.merchant;
$("#merchantSel").onchange = e => { S.merchant = e.target.value; S.openWhy = {}; S.curve.cats = ["c1"]; S.log.page = 0; try { localStorage.setItem("mar-ui-merchant", S.merchant); } catch (er) {} render(); };
$("#rangeSel").onchange = e => { S.range = +e.target.value; S.log.page = 0; render(); toast("Showing " + periodLabel() + "."); };
$$("#agentNav button").forEach(b => b.onclick = () => go(b.dataset.view));
$("#howBtn").onclick = openHow;
$("#menuBtn").onclick = e => { e.stopPropagation(); $("#nav").classList.toggle("open"); };
document.addEventListener("click", e => { const n = $("#nav"); if (n.classList.contains("open") && !n.contains(e.target)) n.classList.remove("open"); });
if (window.Chart) { Chart.defaults.font.family = tok("--f-ui"); Chart.defaults.color = tok("--fg-3"); }
const hashView = (location.hash || "").replace("#", "");
const mq = window.matchMedia("(prefers-color-scheme: dark)"); if (mq.addEventListener) mq.addEventListener("change", () => render());
new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
go(TITLES[hashView] ? hashView : "marketplace");
</script>

</body>
</html>
